[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-ui"
version = "1.3.0"
description = "Lightweight Streamlit UI for TradingAgents"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@v0.3.1",
]

[project.optional-dependencies]
bedrock = ["langchain-aws>=1.5.0"]

[project.scripts]
trade-ui = "trade_ui.cli:main"

[tool.setuptools]
py-modules = [
    "app",
    "preferences",
    "provider_migrations",
    "reporting_adapter",
    "runtime_environment",
    "tradingagents_adapter",
    "tradingagents_compat",
    "ui_advanced",
    "ui_config",
    "ui_panels",
    "ui_styles",
]
include-package-data = true

[tool.setuptools.packages.find]
include = ["trade_ui*", "tools", "images"]

[tool.setuptools.package-data]
tools = [
    "baoyu-markdown-to-html/SKILL.md",
    "baoyu-markdown-to-html/scripts/*.ts",
    "baoyu-markdown-to-html/scripts/*.json",
    "baoyu-markdown-to-html/scripts/*.lock",
    "baoyu-markdown-to-html/scripts/vendor/**",
]
images = ["*.png"]

[tool.setuptools.exclude-package-data]
tools = ["baoyu-markdown-to-html/scripts/node_modules/**"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"ui_styles.py" = ["E501", "W291"]
"ui_config.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
